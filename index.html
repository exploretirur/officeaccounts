<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institute Accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f4;--sf:#fff;--ink:#16222c;--mut:#5d6b76;--ln:#d5dde3;--pri:#1d4e89;--inc:#0b7a5a;--exp:#b4412f}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--sf:#18222a;--ink:#e8eef2;--mut:#93a3af;--ln:#2a3844;--pri:#6aa5e8;--inc:#3fc59a;--exp:#f08a76}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.hide{display:none!important}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--sf)}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);padding:9px 14px;border-radius:6px}
button.p{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:500}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
label{font-size:13px;color:var(--mut);display:block}
#login{max-width:340px;margin:12vh auto;padding:0 20px}
#login h1{font-size:26px;margin:0 0 4px}#login p{color:var(--mut);margin:0 0 20px}
#login label{margin-top:12px}#login button{margin-top:20px;width:100%}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--ln)}
header b{font-size:17px}nav{display:flex;gap:4px;flex:1}
nav button{border:0;background:none;color:var(--mut);padding:8px 12px}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 -2px var(--pri);border-radius:0}
main{max-width:1000px;margin:0 auto;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}.bar>div{width:150px}.bar h2{margin:0 auto 0 0;font-size:20px;width:auto}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.sum{display:grid;grid-template-columns:1.4fr 1fr 1fr}.sum>div{padding:4px 18px;border-left:1px solid var(--ln)}.sum>div:first-child{border:0;padding-left:0}
.sum span{color:var(--mut);font-size:13px}.sum strong{display:block;font-size:26px;line-height:1.2}.sum>div:first-child strong{font-size:36px}
.i{color:var(--inc)}.e{color:var(--exp)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}h3{margin:0 0 12px;font-size:15px}
.row{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.track{background:var(--bg);height:10px;border-radius:5px}.track i{display:block;height:100%;border-radius:5px;background:var(--exp)}
.trend{display:flex;gap:10px;align-items:end;height:150px}.trend div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.trend .b{display:flex;gap:3px;align-items:end;height:120px;justify-content:center}.trend .b i{width:40%;border-radius:3px 3px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--mut);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.wrap{overflow-x:auto}
td button{padding:3px 8px;font-size:12px;margin-left:4px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;max-width:90vw}
.chip{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:2px 4px 2px 10px;margin:0 6px 6px 0}.chip button{border:0;background:none;padding:0 6px}
@media(max-width:700px){.two,.sum{grid-template-columns:1fr}.sum>div{border:0;padding:8px 0}}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);padding:20px;width:min(620px,94vw);max-height:90vh}dialog::backdrop{background:rgba(10,20,30,.55)}
dialog .sum strong{font-size:24px!important}dialog .sum>div:first-child strong{font-size:30px!important}
.plus{width:38px;height:38px;border-radius:50%;padding:0;font-size:24px;line-height:1;background:var(--pri);color:#fff;border-color:var(--pri)}
tr[data-h]:hover{background:var(--bg)}
@media print{header,.noprint{display:none!important}body.pd main{display:none}dialog{border:0;position:static;width:100%}dialog button{display:none}}
</style></head><body>
<section id="login"><h1>Institute Accounts</h1><p>Sign in to continue.</p>
<label>Username<input id="lu" autocomplete="username"></label>
<label>Password<input id="lp" type="password" autocomplete="current-password"></label>
<button class="p" id="lb">Sign in</button></section>
<div id="app" class="hide"><header><b>Institute Accounts</b><nav id="nav"></nav><span id="who" style="color:var(--mut)"></span><button id="out">Sign out</button></header><main id="main"></main></div>
<dialog id="dlg"></dialog><div id="msg" class="hide" role="status"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyXOOd00H5eoOmBao_nGoP9nCPB15GB0yIaBMy4zzqhWZbHPO90zeRhr5pdkRxKkK3l/exec; // the Apps Script /exec link
const $=s=>document.querySelector(s);
const LIB={},CDN='https://cdnjs.cloudflare.com/ajax/libs/';
const loadLib=u=>LIB[u]||(LIB[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{delete LIB[u];no(new Error('Could not load a helper library. Check your internet.'))};document.head.appendChild(s)}));
const needX=()=>loadLib(CDN+'xlsx/0.18.5/xlsx.full.min.js');
const needP=async()=>{await loadLib(CDN+'jspdf/2.5.1/jspdf.umd.min.js');await loadLib(CDN+'jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')};
async function run(fn,...args){
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^ ]+\/exec$/.test(API_URL.trim()))throw new Error('API_URL is not set correctly. Open index.html, find API_URL and paste your Apps Script link (it starts with https://script.google.com/macros/s/ and ends with /exec).');
 let r;try{r=await fetch(API_URL.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}
 catch(e){throw new Error('Cannot reach the server. Check your internet and the API_URL.')}
 const raw=await r.text();let j;
 try{j=JSON.parse(raw)}catch(e){throw new Error('Server did not return data ('+r.status+'). It said: '+raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160))}
 if(!j.ok)throw new Error(j.error||'Server error');return j.data}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
let PRE=null,STU=[],META={categories:[],courses:[]};
const loadMeta=async()=>{META=await run('meta',S.token)};
const CFG={Fees:{title:'Fee collection',fields:[['date','Date','date'],['enroll','Enroll no.','text','','dl-enroll'],['student','Student name','text','','dl-students'],['course','Course','text','','dl-courses'],['amount','Amount (₹)','number'],['mode','Payment mode','select',['Cash','UPI','Card','Bank transfer']],['receipt','Receipt no. (auto if blank)','text'],['note','Note','text']],cols:['date','receipt','enroll','student','course','mode'],edit:['admin','staff']},
Expenses:{title:'Expenses',fields:[['date','Date','date'],['category','Category','select','CATS'],['amount','Amount (₹)','number'],['note','Note','text']],cols:['date','category','note'],edit:['admin']}};
let S=null,tab='',cache={};
const today=()=>new Date(Date.now()+19800000).toISOString().slice(0,10),mstart=()=>today().slice(0,8)+'01';
function toast(m){const e=$('#msg');e.textContent=m;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3500)}
async function go(p){try{return await p}catch(e){const m=(e.message||String(e)).replace(/^Error:\s*/,'');toast(m);if(/Session expired/.test(m))setTimeout(()=>location.reload(),1200);throw e}}
$('#lb').onclick=async()=>{try{S=await run('login',$('#lu').value,$('#lp').value);META=S.meta||META;setTimeout(()=>{needX().catch(()=>0);needP().catch(()=>0)},4000);$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=S.name+' ('+S.role+')';nav()}catch(e){toast((e.message||String(e)||'Login failed').replace(/^Error:\s*/,''))}};
$('#lp').onkeydown=e=>{if(e.key==='Enter')$('#lb').click()};
$('#out').onclick=()=>run('logout',S.token).finally(()=>location.reload());
function nav(){const t={admin:['Dashboard','Students','Fees','Expenses','Reports','Settings','Users'],manager:['Dashboard','Students','Fees','Expenses','Reports'],staff:['Students','Fees']}[S.role];
$('#nav').innerHTML=t.map(x=>`<button data-t="${x}">${x}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};show(t[0])}
function show(t){tab=t;$('#main').onclick=null;$('#main').onsubmit=null;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({Dashboard:dash,Students:studentsView,Reports:reportsView,Fees:()=>ledger('Fees'),Expenses:()=>ledger('Expenses'),Settings:settingsView,Users:usersView})[t]()}
async function dash(f=mstart(),t=today()){
 const d=await go(run('dashboard',S.token,f,t)),net=d.income-d.expense,cats=Object.entries(d.byCat).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...d.trend.map(x=>Math.max(x.inc,x.exp))),cm=Math.max(1,...cats.map(c=>c[1]));
 $('#main').innerHTML=`<div class="bar"><h2>Dashboard</h2><div><label>From<input type="date" id="f" value="${f}"></label></div><div><label>To<input type="date" id="t" value="${t}"></label></div><button class="p" id="ap">Apply</button></div>
 <div class="panel sum"><div><span>Balance for the period</span><strong class="${net<0?'e':'i'}">${inr(net)}</strong></div><div><span>Fees collected (${d.count} receipts)</span><strong class="i">${inr(d.income)}</strong></div><div><span>Expenses</span><strong class="e">${inr(d.expense)}</strong></div></div>
 <div class="two"><div class="panel"><h3>Last 6 months</h3><div class="trend">${d.trend.map(x=>`<div><div class="b"><i style="height:${x.inc/mx*100}%;background:var(--inc)" title="Fees ${inr(x.inc)}"></i><i style="height:${x.exp/mx*100}%;background:var(--exp)" title="Expenses ${inr(x.exp)}"></i></div>${x.label}</div>`).join('')}</div><p style="font-size:12px;color:var(--mut);margin:8px 0 0"><b class="i">■</b> Fees &nbsp;<b class="e">■</b> Expenses</p></div>
 <div class="panel"><h3>Expenses by category</h3>${cats.map(c=>`<div class="row"><span>${esc(c[0])}</span><div class="track"><i style="width:${c[1]/cm*100}%"></i></div><span class="n" style="text-align:right">${inr(c[1])}</span></div>`).join('')||'<p style="color:var(--mut)">No expenses in this period.</p>'}</div></div>
 <div class="panel"><h3>Fees by payment mode</h3>${Object.entries(d.byMode).map(m=>`<span style="margin-right:24px">${esc(m[0])}: <b>${inr(m[1])}</b></span>`).join('')||'<span style="color:var(--mut)">No fees in this period.</span>'}<p style="margin:12px 0 0">Pending balance of all students: <b class="e">${inr(d.pending)}</b></p></div>`;
 $('#ap').onclick=()=>dash($('#f').value,$('#t').value)}
async function ledger(k,f=mstart(),t=today()){
 const c=CFG[k],can=c.edit.includes(S.role),[rows,stu]=await Promise.all([go(run('list',S.token,k,f,t)),k==='Fees'&&can?go(run('students',S.token)):null]),tot=rows.reduce((s,r)=>s+Number(r.amount),0);cache[k]=rows;if(stu)STU=stu;
 const inp=x=>`<div><label>${x[1]}${x[2]==='select'?`<select name="${x[0]}">${(x[3]==='CATS'?META.categories:x[3]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input name="${x[0]}" type="${x[2]}" ${x[2]==='number'?'min="1" step="any"':''} ${x[4]?`list="${x[4]}" autocomplete="off"`:''}>`}</label></div>`;
 $('#main').innerHTML=`${can&&k==='Fees'?`<div class="panel noprint"><h3>Student list</h3><p style="margin:0 0 10px;color:var(--mut)">${STU.length} students saved. Type an enroll no. or name in the form below and the rest fills in. Bulk upload from Excel is in the Students tab.</p><button type="button" id="ns">+ New student</button></div>`:''}${can?`<form id="fm" class="panel noprint"><datalist id="dl-students">${STU.map(s=>`<option value="${esc(s.name)}">${esc(s.course)}</option>`).join('')}</datalist><datalist id="dl-enroll">${STU.filter(s=>s.enroll).map(s=>`<option value="${esc(s.enroll)}">${esc(s.name)}</option>`).join('')}</datalist><datalist id="dl-courses">${META.courses.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><h3 id="ft">New entry</h3><div class="grid">${c.fields.map(inp).join('')}${k==='Fees'?'<p id="bal" style="grid-column:1/-1;margin:0"></p>':''}<div><button class="p" type="submit">Save</button> <button type="button" id="cl">Clear</button></div></div></form>`:''}
 <div class="bar"><h2>${c.title}</h2><div><label>From<input type="date" id="f" value="${f}"></label></div><div><label>To<input type="date" id="t" value="${t}"></label></div><button id="ap">Show</button><button id="pr" class="noprint">Print</button></div>
 <div class="panel wrap"><table><thead><tr>${c.cols.map(x=>`<th>${x[0].toUpperCase()+x.slice(1)}</th>`).join('')}<th class="n">Amount</th>${can||S.role==='admin'?'<th></th>':''}</tr></thead><tbody>
 ${rows.map(r=>`<tr>${c.cols.map(x=>`<td>${esc(r[x])}</td>`).join('')}<td class="n">${inr(r.amount)}</td>${can?`<td class="n noprint"><button data-e="${r.id}">Edit</button>${S.role==='admin'?`<button data-d="${r.id}">Delete</button>`:''}</td>`:''}</tr>`).join('')||`<tr><td colspan="9" style="color:var(--mut)">No entries in this period.</td></tr>`}
 </tbody><tfoot><tr><th colspan="${c.cols.length}">Total (${rows.length})</th><th class="n">${inr(tot)}</th>${can?'<th></th>':''}</tr></tfoot></table></div>`;
 const R=()=>ledger(k,$('#f').value,$('#t').value);$('#ap').onclick=R;$('#pr').onclick=()=>print();
 if(!can)return;const fm=$('#fm');let eid='';
 const reset=()=>{fm.reset();eid='';fm.date.value=today();$('#ft').textContent='New entry';if($('#bal'))$('#bal').innerHTML=''};reset();$('#cl').onclick=reset;
 if(k==='Fees'){
 const hint=s=>$('#bal').innerHTML=s?`Total fee <b>${inr(s.totalFee)}</b> · Paid <b class="i">${inr(s.paid)}</b> · Balance <b class="${s.balance>0?'e':'i'}">${inr(s.balance)}</b>`:'',
 pick=s=>{fm.enroll.value=s.enroll;fm.student.value=s.name;if(s.course)fm.course.value=s.course;hint(s)};
 fm.student.oninput=()=>{const s=STU.find(x=>x.name.toLowerCase()===fm.student.value.trim().toLowerCase());s?pick(s):hint(null)};
 fm.enroll.oninput=()=>{const s=STU.find(x=>x.enroll&&x.enroll.toLowerCase()===fm.enroll.value.trim().toLowerCase());s?pick(s):hint(null)};
 $('#ns').onclick=()=>studentForm(null,R);if(PRE){pick(PRE);PRE=null}}
 fm.onsubmit=async e=>{e.preventDefault();const o={id:eid};c.fields.forEach(x=>o[x[0]]=fm[x[0]].value);await go(run('save',S.token,k,o));toast('Saved');R()};
 $('#main').onclick=async e=>{const b=e.target;if(b.dataset.e){const r=rows.find(x=>x.id===b.dataset.e);eid=r.id;c.fields.forEach(x=>{const el=fm[x[0]];if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===r[x[0]]))el.add(new Option(r[x[0]]));el.value=r[x[0]]});$('#ft').textContent='Edit entry';if(fm.enroll&&fm.enroll.oninput)fm.enroll.oninput();scrollTo(0,0)}
 if(b.dataset.d&&confirm('Delete this entry permanently?')){await go(run('remove',S.token,k,b.dataset.d));toast('Deleted');R()}}}
const RT={day:'Day wise collection',week:'Week wise collection',month:'Month wise collection',course:'Course wise summary',student:'Total paid & balance (student wise)',range:'Date to date (all receipts)'};
const wk=d=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-(x.getUTCDay()+6)%7);return x.toISOString().slice(0,10)};
const fv=(m,i,v,pdf)=>m.cur.includes(i)?(pdf?'Rs. ':'₹')+Number(v||0).toLocaleString('en-IN'):v==null?'':String(v);
async function buildReport(ty,f,t){
 const [fees,st]=await Promise.all([ty==='student'?[]:go(run('list',S.token,'Fees',f,t)),['student','course'].includes(ty)?go(run('students',S.token)):null]),m={ty:ty,title:RT[ty],sub:'Period: '+f+' to '+t};
 const tot=(rows,i)=>rows.reduce((s,r)=>s+Number(r[i]||0),0);
 const grp=fn=>{const o={};fees.forEach(r=>{const k=fn(r.date);o[k]=o[k]||[k,0,0];o[k][1]++;o[k][2]+=Number(r.amount)});return Object.keys(o).sort().map(k=>o[k])};
 if(['day','week','month'].includes(ty)){
  m.cols=[{day:'Date',week:'Week starting (Mon)',month:'Month'}[ty],'Receipts','Amount collected'];
  m.rows=grp(ty==='day'?d=>d:ty==='week'?wk:d=>d.slice(0,7));m.num=[1,2];m.cur=[2];m.foot=['Total',tot(m.rows,1),tot(m.rows,2)]}
 else if(ty==='range'){
  m.cols=['Date','Receipt','Enroll no.','Student','Course','Mode','Amount'];m.rows=fees.slice().reverse().map(r=>[r.date,r.receipt,r.enroll,r.student,r.course,r.mode,Number(r.amount)]);
  m.num=[6];m.cur=[6];m.foot=['Total','','','','','',tot(m.rows,6)]}
 else{
  if(ty==='student'){m.sub='All-time position of every student';m.cols=['Enroll no.','Name','Course','Total fee','Total paid','Balance'];
   m.rows=st.slice().sort((a,b)=>b.balance-a.balance).map(s=>[s.enroll,s.name,s.course,s.totalFee,s.paid,s.balance]);m.num=[3,4,5];m.cur=[3,4,5];m.foot=['Total','','',tot(m.rows,3),tot(m.rows,4),tot(m.rows,5)]}
  else{const o={},nw=k=>o[k]=o[k]||[k,0,0,0,0,0];
   st.forEach(s=>{const c=nw(s.course||'—');c[1]++;c[2]+=s.totalFee;c[3]+=s.paid;c[4]+=s.balance});fees.forEach(r=>{nw(r.course||'—')[5]+=Number(r.amount)});
   m.sub+=' (fee totals are all-time; "Collected" is for the period)';m.cols=['Course','Students','Total fee','Total paid','Balance','Collected in period'];
   m.rows=Object.values(o).sort((a,b)=>a[0]<b[0]?-1:1);m.num=[1,2,3,4,5];m.cur=[2,3,4,5];m.foot=['Total',tot(m.rows,1),tot(m.rows,2),tot(m.rows,3),tot(m.rows,4),tot(m.rows,5)]}}
 return m}
const fname=m=>'report-'+m.ty+'-'+today();
async function dlXlsx(m){await go(needX());
 const ws=XLSX.utils.aoa_to_sheet([[m.title],[m.sub],[],m.cols,...m.rows,m.foot]),wb=XLSX.utils.book_new();ws['!cols']=m.cols.map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,'Report');XLSX.writeFile(wb,fname(m)+'.xlsx')}
async function dlPdf(m){await go(needP());
 const p=new window.jspdf.jsPDF({orientation:m.cols.length>5?'landscape':'portrait'}),al={};m.num.forEach(i=>al[i]={halign:'right'});
 p.setFontSize(15);p.text(m.title,14,16);p.setFontSize(10);p.text(m.sub,14,23);
 p.autoTable({startY:28,head:[m.cols],body:m.rows.map(r=>r.map((v,i)=>fv(m,i,v,1))),foot:[m.foot.map((v,i)=>fv(m,i,v,1))],columnStyles:al,styles:{fontSize:9},headStyles:{fillColor:[29,78,137]},footStyles:{fillColor:[230,236,242],textColor:20}});
 p.setFontSize(8);p.text('Generated '+today()+' by '+S.name,14,p.internal.pageSize.getHeight()-8);p.save(fname(m)+'.pdf')}
function reportsView(){
 $('#main').innerHTML=`<div class="bar"><h2>Reports</h2><div style="width:260px"><label>Report<select id="rt">${Object.entries(RT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div><div><label>From<input type="date" id="f" value="${mstart()}"></label></div><div><label>To<input type="date" id="t" value="${today()}"></label></div><button class="p" id="sh">Show</button></div><div id="rp"><p style="color:var(--mut)">Choose a report and dates, then click Show.</p></div>`;
 const rt=$('#rt');rt.onchange=()=>{$('#f').disabled=$('#t').disabled=rt.value==='student'};
 $('#sh').onclick=async()=>{const m=await go(buildReport(rt.value,$('#f').value,$('#t').value)),N=i=>m.num.includes(i)?' class="n"':'';
  $('#rp').innerHTML=`<div class="panel"><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px"><div style="margin-right:auto"><h3 style="margin:0">${esc(m.title)}</h3><span style="color:var(--mut);font-size:13px">${esc(m.sub)}</span></div><button id="dp">Download PDF</button><button id="dx">Download Excel</button></div>
  <div class="wrap"><table><thead><tr>${m.cols.map((c,i)=>`<th${N(i)}>${esc(c)}</th>`).join('')}</tr></thead><tbody>${m.rows.map(r=>`<tr>${r.map((v,i)=>`<td${N(i)}>${esc(fv(m,i,v))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${m.cols.length}" style="color:var(--mut)">No data for this period.</td></tr>`}</tbody><tfoot><tr>${m.foot.map((v,i)=>`<th${N(i)}>${esc(fv(m,i,v))}</th>`).join('')}</tr></tfoot></table></div></div>`;
  $('#dp').onclick=()=>dlPdf(m);$('#dx').onclick=()=>dlXlsx(m)}}
const canS=()=>['admin','staff'].includes(S.role);
function openD(){const d=$('#dlg');if(!d.open)d.showModal();return d}
function studentForm(s,after){
 s=s||{};const d=openD(),cs=META.courses.slice();if(s.course&&!cs.includes(s.course))cs.push(s.course);
 d.innerHTML=`<form id="sf"><h3 style="margin-top:0">${s.id?'Edit student':'New student'}</h3><div class="grid" style="grid-template-columns:1fr 1fr">
 <label>Enrollment no.<input name="enroll" required value="${esc(s.enroll)}"></label>
 <label>Name<input name="name" required value="${esc(s.name)}"></label>
 <label>Course<select name="course" required><option value="">Select course</option>${cs.map(c=>`<option${c===s.course?' selected':''}>${esc(c)}</option>`).join('')}</select></label>
 <label>Duration<input name="duration" list="dl-dur" placeholder="e.g. 6 months" value="${esc(s.duration)}"><datalist id="dl-dur"><option value="1 month"><option value="3 months"><option value="6 months"><option value="1 year"></datalist></label>
 <label>Total fee (₹)<input name="totalFee" type="number" min="0" step="any" required value="${s.totalFee||''}"></label></div>
 <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button type="button" id="cx">Cancel</button><button class="p" type="submit">Save</button></div></form>`;
 $('#cx').onclick=()=>d.close();
 $('#sf').onsubmit=async e=>{e.preventDefault();const f=e.target;await go(run('saveStudent',S.token,{id:s.id,enroll:f.enroll.value,name:f.name.value,course:f.course.value,duration:f.duration.value,totalFee:f.totalFee.value}));d.close();toast('Student saved');after&&after()}}
async function hist(id){
 const h=await go(run('studentHistory',S.token,id)),s=h.student,d=openD(),tot=h.payments.reduce((a,p)=>a+p.amount,0);
 d.innerHTML=`<h3 style="margin:0">${esc(s.name)} <span style="color:var(--mut);font-weight:400">· ${esc(s.enroll)}</span></h3><p style="margin:2px 0 14px;color:var(--mut)">${esc(s.course)}${s.duration?' · '+esc(s.duration):''}</p>
 <div class="sum"><div><span>Balance</span><strong class="${s.balance>0?'e':'i'}">${inr(Math.max(0,s.balance))}</strong></div><div><span>Paid</span><strong class="i">${inr(s.paid)}</strong></div><div><span>Total fee</span><strong>${inr(s.totalFee)}</strong></div></div>
 <h3 style="margin:16px 0 6px">Payment history (${h.payments.length})</h3><div class="wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>Date</th><th>Receipt</th><th>Mode</th><th>Note</th><th class="n">Amount</th></tr></thead><tbody>
 ${h.payments.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.receipt)}</td><td>${esc(p.mode)}</td><td>${esc(p.note)}</td><td class="n">${inr(p.amount)}</td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mut)">No payments yet.</td></tr>'}</tbody><tfoot><tr><th colspan="4">Total paid</th><th class="n">${inr(tot)}</th></tr></tfoot></table></div>
 <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${canS()?'<button class="p" id="pay">+ Add payment</button><button id="ed">Edit student</button>':''}${S.role==='admin'?'<button id="dl">Delete</button>':''}<button id="pt">Print</button><button id="cx">Close</button></div>`;
 $('#cx').onclick=()=>d.close();$('#pt').onclick=()=>{document.body.classList.add('pd');print();document.body.classList.remove('pd')};
 if(canS()){$('#pay').onclick=()=>{PRE=s;d.close();show('Fees')};$('#ed').onclick=()=>studentForm(s,()=>hist(id).then(()=>tab==='Students'&&studentsView()))}
 if(S.role==='admin')$('#dl').onclick=async()=>{if(confirm('Delete this student? Payments stay in the Fees list.')){await go(run('remove',S.token,'Students',id));d.close();studentsView()}}}
async function studentsView(){
 STU=await go(run('students',S.token));
 const T=STU.reduce((a,x)=>({f:a.f+x.totalFee,p:a.p+x.paid,b:a.b+Math.max(0,x.totalFee?x.balance:0)}),{f:0,p:0,b:0});
 const rowsH=q=>STU.filter(s=>(s.name+' '+s.enroll+' '+s.course).toLowerCase().includes(q.toLowerCase())).map(s=>`<tr data-h="${s.id}" style="cursor:pointer"><td>${esc(s.enroll)}</td><td>${esc(s.name)}</td><td>${esc(s.course)}</td><td>${esc(s.duration)}</td><td class="n">${inr(s.totalFee)}</td><td class="n i">${inr(s.paid)}</td><td class="n ${s.balance>0?'e':'i'}">${s.totalFee?(s.balance>0?inr(s.balance):'Paid'):'—'}</td><td class="n"><button data-h="${s.id}">History</button></td></tr>`).join('')||'<tr><td colspan="8" style="color:var(--mut)">No students found.</td></tr>';
 $('#main').innerHTML=`<div class="bar"><h2>Students</h2><div style="width:240px"><label>Search<input id="q" placeholder="Name, enroll no. or course"></label></div>${canS()?'<button class="plus" id="ad" title="Add student" aria-label="Add student">+</button>':''}</div>
 <p style="color:var(--mut)">${STU.length} students · Total fees <b>${inr(T.f)}</b> · Collected <b class="i">${inr(T.p)}</b> · Pending <b class="e">${inr(T.b)}</b></p>
 ${canS()?`<div class="panel noprint"><h3>Bulk upload from Excel</h3><p style="margin:0 0 10px;color:var(--mut)">Columns: <b>Enroll No, Name, Course, Duration, Total Fee, Phone</b>. Students with an existing enroll no. are skipped.</p><input type="file" id="xl" accept=".xlsx,.xls,.csv" style="width:auto"> <button type="button" id="tpl">Download template</button></div>`:''}<div class="panel wrap"><table><thead><tr><th>Enroll no.</th><th>Name</th><th>Course</th><th>Duration</th><th class="n">Total fee</th><th class="n">Paid</th><th class="n">Balance</th><th></th></tr></thead><tbody id="tb">${rowsH('')}</tbody></table></div>`;
 $('#q').oninput=e=>$('#tb').innerHTML=rowsH(e.target.value);
 if(canS()){$('#ad').onclick=()=>studentForm(null,studentsView);
 $('#tpl').onclick=async()=>{await go(needX());const ws=XLSX.utils.aoa_to_sheet([['Enroll No','Name','Course','Duration','Total Fee','Phone'],['2026001','Sample Student','Tally','3 months',6000,'9876543210']]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Students');XLSX.writeFile(wb,'student-template.xlsx')};
 $('#xl').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;await go(needX());
  const wb=XLSX.read(await fl.arrayBuffer()),rr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const list=rr.map(r=>{const o={};for(const q in r)o[q.trim().toLowerCase()]=String(r[q]).trim();return{name:o.name||o['student name']||o.student||'',course:o.course||'',phone:o.phone||o.mobile||'',enroll:o['enroll no']||o['enroll no.']||o['enrollment no']||o.enroll||o.enrollment||'',duration:o.duration||'',totalFee:String(o['total fee']||o.fee||o.totalfee||'').replace(/,/g,'')}}).filter(x=>x.name);
  if(!list.length)return toast('No student names found. Check the column headings.');
  const r=await go(run('importStudents',S.token,list));toast(r.added+' added, '+r.skipped+' already existed');studentsView()}}
 $('#main').onclick=e=>{const r=e.target.closest('[data-h]');if(r)hist(r.dataset.h)}}
async function settingsView(){
 await go(loadMeta());
 const box=(ty,title,arr)=>`<div class="panel"><h3>${title}</h3><form data-add="${ty}" style="display:flex;gap:8px;margin-bottom:12px"><input name="v" placeholder="Add new" required><button class="p">Add</button></form>${arr.map(v=>`<span class="chip">${esc(v)}<button data-rm="${ty}" data-v="${esc(v)}" aria-label="Remove ${esc(v)}">×</button></span>`).join('')}</div>`;
 $('#main').innerHTML=`<div class="bar"><h2>Settings</h2></div><div class="two">${box('category','Expense categories',META.categories)}${box('course','Courses',META.courses)}</div>`;
 $('#main').onsubmit=async e=>{e.preventDefault();const f=e.target;await go(run('addItem',S.token,f.dataset.add,f.v.value));settingsView()};
 $('#main').onclick=async e=>{const b=e.target;if(b.dataset.rm&&confirm('Remove "'+b.dataset.v+'"? Old entries keep their text.')){await go(run('removeItem',S.token,b.dataset.rm,b.dataset.v));settingsView()}}}
async function usersView(){
 const u=await go(run('users',S.token));
 $('#main').innerHTML=`<form id="uf" class="panel"><h3>Add a user or reset a password</h3><div class="grid"><div><label>Username<input name="username" required></label></div><div><label>Display name<input name="name"></label></div><div><label>Role<select name="role"><option value="staff">Office staff</option><option value="manager">Manager</option><option value="admin">Admin</option></select></label></div><div><label>New password<input name="password" type="password" required></label></div><div><button class="p">Save user</button></div></div></form>
 <div class="panel wrap"><table><thead><tr><th>Username</th><th>Name</th><th>Role</th></tr></thead><tbody>${u.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.role)}</td></tr>`).join('')}</tbody></table></div>`;
 $('#uf').onsubmit=async e=>{e.preventDefault();const f=e.target;await go(run('saveUser',S.token,{username:f.username.value.trim(),name:f.name.value,role:f.role.value,password:f.password.value}));toast('User saved');usersView()}}
</script></body></html>
